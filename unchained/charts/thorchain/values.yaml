name: thorchain

api:
  tier: api
  image: "shapeshiftdao/unchained-thorchain-api:latest"
  replicas: 1
  autoscaling: true
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 250m
    memory: 250Mi
  env:
  - name: LCD_URL
    value: "http://thorchain-svc.arkeo.svc.cluster.local:1317"
  - name: WS_URL
    value: "ws://thorchain-svc.arkeo.svc.cluster.local:27147"
  - name: RPC_URL
    value: "http://thorchain-svc.arkeo.svc.cluster.local:27147"

statefulset:
  name: thorchain
  replicas: 1
  containers:
    - name: daemon
      image: "registry.gitlab.com/thorchain/thornode:mainnet-3.2.0"
      ports:
      - name: daemon-api
        containerPort: 1317
      - name: daemon-rpc
        containerPort: 27147
      env:
      - name: DEBUG
        value: 'false'
      - name: THOR_AUTO_STATE_SYNC_ENABLED
        value: 'true'
      - name: THOR_TENDERMINT_LOG_FORMAT
        value: "json"
      - name: NETWORK
        value: 'mainnet'
      - name: CHAIN_ID
        value: 'thorchain-1'
      - name: SIGNER_NAME
        value: 'thorchain'
      - name: SIGNER_PASSWD
        value: 'password'
      limits:
        cpu: 2
        memory: 12Gi
      requests:
        cpu: 1
      storage_size: 3500Gi
      dataDir: /root
    - name: timescaledb
      image: "timescale/timescaledb:2.13.0-pg15"
      env:
      - name: POSTGRES_DB
        value: 'midgard'
      - name: POSTGRES_USER
        value: 'midgard'
      - name: POSTGRES_PASSWORD
        value: 'password'
      - name: PGDATA
        value: '/var/lib/postgresql/data/pgdata'
      ports:
      - name: postgres
        containerPort: 5432
      limits:
        cpu: 2
        memory: 6Gi
      requests:
        cpu: 1
      storage_size: 500Gi
      dataDir: '/var/lib/postgresql/data'
    - name: indexer
      image: "registry.gitlab.com/thorchain/midgard:2.29.5"
      env:
      - name: MIDGARD_GENESIS_REMOTE
        value: 'https://rpc-v1.ninerealms.com/genesis'
      - name: MIDGARD_GENESIS_LOCAL
        value: '/blockstore/genesis.json'
      - name: MIDGARD_GENESIS_INITIAL_BLOCK_HEIGHT
        value: '4786560'
      - name: MIDGARD_GENESIS_INITIAL_BLOCK_HASH
        value: '9B86543A5CF5E26E3CE93C8349B2EABE5E238DFFC9EBE8EC6207FE7178FF27AC'
      - name: MIDGARD_BLOCKSTORE_REMOTE
        value: 'https://storage.googleapis.com/public-snapshots-ninerealms/midgard-blockstore/'
      ports:
      - name: midgard
        containerPort: 8080
      limits:
        cpu: 1
        memory: 1Gi
      requests:
        cpu: 500m
      storage_size: 100Gi
      dataDir: '/blockstore'
