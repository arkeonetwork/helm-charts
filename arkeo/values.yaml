# Default values for arkeo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

net: mainnet
type: validator

arkeo:
  version: v1.0.3-prerelease
  moniker: arkeo-node
  fees: 5000uarkeo
  amount: 1000000
  app_setting:
    pruning: custom 
    pruning_keep_recent: 100
    pruning_interval: 50
    minimum_gas_prices: 0.001uarkeo
    swagger: true
  seeds: 9dfa5f2d19c1174baf5e597965394269e654f9b7@seed31.innovationtheory.com:26656
  peers: 8eac1da41b8b1a8c33f23263f5a1eb985a411d48@5.189.137.206:26656,ea2c062d7a607758b7eced85f6b53e4a7620727a@204.16.241.190:26656
  snapshot: https://snapshots-testnet.nodejumper.io/arkeo/arkeo_latest.tar.lz4
  addrbook: https://snapshots-testnet.nodejumper.io/arkeo/addrbook.json


autoupdate:
  enabled: false

signer:
  name: arkeo
  password: password
  mnemonicSecret: ""
  passwordSecret: ""

peer: seed31.innovationtheory.com
peerApi: seed31.innovationtheory.com

# See docs/Thornode-Snapshot-Recovery-and-Storage-Management.md for details.
statesync:
  auto: false
  snapshotInterval: 0

# provide custom environment variables to override config defaults:
# https://gitlab.com/arkeo/arkeo/-/blob/develop/config/default.yaml
env:
  SEED: seed31.innovationtheory.com:26656
  RPC: seed31.innovationtheory.com:26657

debug: false
chainID:
  testnet: arkeo-testnet-3
  mainnet: arkeo-testnet-3
  stagenet: arkeo-stagenet-v1

haltHeight:

replicaCount: 1

strategyType: Recreate

image:
  repository: ghcr.io/arkeonetwork/arkeo-testnet
  pullPolicy: Always
  tag: 1.0.3-prerelease

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port:
    api: 1317
    testnet:
      p2p: 26656
      rpc: 26657
    stagenet:
      p2p: 26656
      rpc: 26657
    mainnet:
      p2p: 26656
      rpc: 26657

persistence:
  enabled: true
  size:
    testnet: 256Gi
    stagenet: 512Gi
    mainnet: 512Gi
  accessMode: ReadWriteOnce
  # existingClaim: your-pvc
  # storageClass: "-"
  # hostPath: /host-path
  # subPath: subpath

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

priorityClassName: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  requests:
    cpu: 4
    memory: 4Gi
  limits:
    # cpu: 2
    # memory: 4Gi

nodeSelector: {}

tolerations: []

affinity: {}

global:
  images:
    alpineK8s:
      tag: 1.18.2
      hash: 768491682ca99e14498ddb62973a95a664a0525ca18e7ad0eaab2621d3124f5b
    busybox:
      tag: latest
      hash: caa382c432891547782ce7140fb3b7304613d3b0438834dce1cad68896ab110a
