# Default values for arkeo.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

net: mainnet
type: validator

arkeo:
  version: v1.0.14
  moniker: arkeo-seed
  fees: 5000uarkeo
  amount: 1000000
  app_setting:
    pruning: custom
    pruning_keep_recent: 100
    pruning_interval: 50
    minimum_gas_prices: 0.001uarkeo
    swagger: true
#  seeds: b5fe75682387729e63f00cf08438b57069ede679@seedm1.innovationtheory.com:26656
  seeds: b5fe75682387729e63f00cf08438b57069ede679@seed2.arkeo.network:26656
#  snapshot: https://snapshots-testnet.nodejumper.io/arkeo/arkeo_latest.tar.lz4
#  addrbook: https://snapshots-testnet.nodejumper.io/arkeo/addrbook.json


autoupdate:
  enabled: false

signer:
  name: arkeo
  password: password
  mnemonicSecret: ""
  passwordSecret: ""

peer: peer1.arkeo.network
peerApi: seed2.arkeo.network

# See docs/Thornode-Snapshot-Recovery-and-Storage-Management.md for details.
statesync:
  auto: false
  snapshotInterval: 0

# provide custom environment variables to override config defaults:
# https://gitlab.com/arkeo/arkeo/-/blob/develop/config/default.yaml
env:
  SEED: seed2.arkeo.network:26656
  RPC: seed2.arkeo.network:26657

debug: false
chainID:
  testnet: arkeo-testnet-3
  mainnet: arkeo-main-v1
  stagenet: arkeo-stagenet-v1

haltHeight:

replicaCount: 1

strategyType: Recreate

image:
  repository: ghcr.io/arkeonetwork/arkeo
  pullPolicy: Always
  tag: 1.0.14
  hash: faa09d89e5fc649b18346368fa2ce0a0f3b67197ebdd6ee8dfaf0423f89eefcf

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port:
    api: 1317
    testnet:
      p2p: 26656
      rpc: 26657
    stagenet:
      p2p: 26656
      rpc: 26657
    mainnet:
      p2p: 26656
      rpc: 26657

persistence:
  enabled: true
  size:
    testnet: 256Gi
    stagenet: 512Gi
    mainnet: 512Gi
  accessMode: ReadWriteOnce
  # existingClaim: your-pvc
  # storageClass: "-"
  # hostPath: /host-path
  # subPath: subpath

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

priorityClassName: ""

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  requests:
    cpu: 4
    memory: 4Gi
  limits:
    # cpu: 2
    # memory: 4Gi

nodeSelector: {}

tolerations: []

affinity: {}

global:
  images:
    alpineK8s:
      tag: 1.18.2
      hash: 768491682ca99e14498ddb62973a95a664a0525ca18e7ad0eaab2621d3124f5b
    busybox:
      tag: latest
      hash: caa382c432891547782ce7140fb3b7304613d3b0438834dce1cad68896ab110a
