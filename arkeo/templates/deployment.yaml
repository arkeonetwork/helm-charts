apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arkeo.fullname" . }}
  labels:
    {{- include "arkeo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategyType }}
  selector:
    matchLabels:
      {{- include "arkeo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "arkeo.selectorLabels" . | nindent 8 }}
    spec:
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "arkeo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}

      initContainers:
      - name: init-external-ip
        image: alpine/k8s:{{ .Values.global.images.alpineK8s.tag }}@sha256:{{ .Values.global.images.alpineK8s.hash }}
        {{- if .Values.global.gateway.enabled }}
        command: ['/scripts/setup-testnet.sh', 'false', '{{ .Values.global.gateway.name }}', '{{ include "arkeo.fullname" . }}-setup-testnet']
        {{- else }}
        command: ['/scripts/setup-testnet.sh', 'false', '{{ include "arkeo.fullname" . }}', '{{ include "arkeo.fullname" . }}-setup-testnet']
        {{- end }}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: arkeo-data
          mountPath: /root/.arkeo

      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "arkeo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - arkeod
            - start
            - --pruning
            - nothing
            - --minimum-gas-prices
            - 0.0001uarkeo
            - --home
            - /root/.arkeo
          volumeMounts:
            - name: arkeo-data
              mountPath: /root/.arkeo
            - name: scripts
              mountPath: /kube-scripts/
            - name: tmp
              mountPath: /tmp  
          ports:
            - name: api
              containerPort: {{ .Values.service.port.api }}
              protocol: TCP
            - name: p2p
              containerPort: {{ include "arkeo.p2p" . }}
              protocol: TCP
            - name: rpc
              containerPort: {{ include "arkeo.rpc" . }}
              protocol: TCP
            - name: prometheus
              containerPort: 26660
              protocol: TCP
          livenessProbe:
            timeoutSeconds: 10
            httpGet:
              path: /status
              port: rpc
          startupProbe:
            failureThreshold: 30
            timeoutSeconds: 10
            httpGet:
              path: /status
              port: rpc
          readinessProbe:
            timeoutSeconds: 10
            httpGet:
              path: /status
              port: rpc
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: arkeo-data
          emptyDir: {}
        - name: tmp
          emptyDir: {} 
        - name: data
          emptyDir: {}
        - name: scripts
          configMap:
            name: {{ include "arkeo.fullname" . }}-scripts
            defaultMode: 0777
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
