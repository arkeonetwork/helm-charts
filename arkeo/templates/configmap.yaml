apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "arkeo.fullname" . }}-scripts
data:
  retry.sh: |
    #!/bin/sh

    TRY=0

    while [ $TRY -lt 5 ]
    do
      "$@" 2>/tmp/retry-out

      cat /tmp/retry-out
      if ! grep "account sequence mismatch" /tmp/retry-out >/dev/null; then
        break
      fi

      TRY=$((TRY+1))
      echo Retrying account sequence mismatch, try $TRY...
      sleep 2
    done

  set-node-keys.sh: |
    #!/bin/sh

    NODE_PUB_KEY=$(echo "$SIGNER_PASSWD" | arkeo keys show arkeo --pubkey --keyring-backend file | arkeo pubkey)
    NODE_PUB_KEY_ED25519=$(echo "$SIGNER_PASSWD" | arkeo ed25519)
    VALIDATOR=$(arkeo tendermint show-validator | arkeo pubkey --bech cons)
    printf "%s\n%s\n" "$SIGNER_PASSWD" "$SIGNER_PASSWD" | arkeo tx arkeo set-node-keys "$NODE_PUB_KEY" "$NODE_PUB_KEY_ED25519" "$VALIDATOR" --from "$SIGNER_NAME" --keyring-backend file --chain-id "$CHAIN_ID" --yes --gas auto --gas-adjustment 2 --node "tcp://localhost:$ARKEO_SERVICE_PORT_RPC"

  set-ip-address.sh: |
    #!/bin/sh

    NODE_IP_ADDRESS=${1:-$(curl -s http://whatismyip.akamai.com)}
    printf "%s\n%s\n" "$SIGNER_PASSWD" "$SIGNER_PASSWD" | arkeo tx arkeo set-ip-address "$NODE_IP_ADDRESS" --from "$SIGNER_NAME" --keyring-backend file --chain-id "$CHAIN_ID" --yes --gas auto --gas-adjustment 2 --node "tcp://localhost:$ARKEO_SERVICE_PORT_RPC"

  set-version.sh: |
    #!/bin/sh

    printf "%s\n%s\n" "$SIGNER_PASSWD" "$SIGNER_PASSWD" | arkeo tx arkeo set-version --from "$SIGNER_NAME" --keyring-backend file --chain-id "$CHAIN_ID" --yes --gas auto --gas-adjustment 2 --node "tcp://localhost:$ARKEO_SERVICE_PORT_RPC"

  pause.sh: |
    #!/bin/sh

    printf "%s\n%s\n" "$SIGNER_PASSWD" "$SIGNER_PASSWD" | arkeo tx arkeo pause-chain --from "$SIGNER_NAME" --keyring-backend file --chain-id "$CHAIN_ID" --yes --gas auto --gas-adjustment 2 --node "tcp://localhost:$ARKEO_SERVICE_PORT_RPC"

  resume.sh: |
    #!/bin/sh

    printf "%s\n%s\n" "$SIGNER_PASSWD" "$SIGNER_PASSWD" | arkeo tx arkeo resume-chain --from "$SIGNER_NAME" --keyring-backend file --chain-id "$CHAIN_ID" --yes --gas auto --gas-adjustment 2 --node "tcp://localhost:$ARKEO_SERVICE_PORT_RPC"

  relay.sh: |
    #!/bin/sh

    printf "%s\n%s\n%s\n" "$SIGNER_NAME" "$SIGNER_PASSWD" "$SIGNER_PASSWD" | arkeo query arkeo discord-relay "$1" "$2" --node "tcp://localhost:$ARKEO_SERVICE_PORT_RPC"

  mimir.sh: |
    #!/bin/sh

    printf "%s\n%s\n" "$SIGNER_PASSWD" "$SIGNER_PASSWD" | arkeo tx arkeo mimir "$1" "$2" --from "$SIGNER_NAME" --keyring-backend file --chain-id "$CHAIN_ID" --yes --gas auto --gas-adjustment 2 --node "tcp://localhost:$ARKEO_SERVICE_PORT_RPC"

  ban.sh: |
    #!/bin/sh

    printf "%s\n%s\n" "$SIGNER_PASSWD" "$SIGNER_PASSWD" | arkeo tx arkeo ban "$1" --from "$SIGNER_NAME" --keyring-backend file --chain-id "$CHAIN_ID" --yes --gas auto --gas-adjustment 2 --node "tcp://localhost:$ARKEO_SERVICE_PORT_RPC"

  external-ip.sh: |
    #!/bin/bash
    # ./external-ip.sh <host_network> <service_name> <config_map>
    #
    # Script to extract external ip from a service:
    # If host network returns public ip of the node
    # If LoadBalancer returns external IP either directly or from hostname
    # If ClusterIP return service IP
    # If NodePort returns node IP

    apk add bind-tools

    HOST_NETWORK=$1
    SERVICE=$2
    CONFIGMAP=$3

    if [ "$HOST_NETWORK" = "true" ]; then
      external_ip=$(curl -s http://whatismyip.akamai.com)
    else
      type=$(kubectl get svc "$SERVICE" -o jsonpath='{.spec.type}')
      external_ip=""

      if [ "$type" = "ClusterIP" ]; then
        external_ip=$(kubectl get svc "$SERVICE" -o jsonpath='{.spec.clusterIP}')
      elif [ "$type" = "NodePort" ]; then
        external_ip=$(kubectl get nodes --selector=kubernetes.io/role!=master -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
      elif [ "$type" = "LoadBalancer" ]; then
        # Hack TODO remove when this is fixed here https://github.com/kubernetes/kubernetes/issues/82595
        kubectl annotate svc "$SERVICE" service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled=false --overwrite
        sleep 5
        kubectl annotate svc "$SERVICE" service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled=true --overwrite

        while [ -z "$external_ip" ]; do
          echo "Waiting for load balancer external endpoint..."
          external_ip=$(kubectl get svc "$SERVICE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -z "$external_ip" ]; then
            hostname=$(kubectl get svc "$SERVICE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$hostname" ] && external_ip=$(dig +short "$hostname" | sort | head -1)
          fi
          [ -z "$external_ip" ] && sleep 10
        done
      fi
    fi

    kubectl create configmap "$CONFIGMAP" --from-literal=externalIP="$external_ip" --dry-run=client -o yaml | kubectl apply -f -

  auto-update.sh: |
    #!/bin/bash

    set -euo pipefail

    # retrieve current nodes
    curl -sL -o /tmp/nodes {{ .Values.autoupdate.nodes }}

    # lookup version used by 2/3 of the network
    ACTIVE_NODES=$(jq -r '[.[] | select(.status == "Active")] | length' /tmp/nodes)
    THRESHOLD=$(($ACTIVE_NODES*2/3))
    NET_VERSION=$(jq -r "[.[] | select(.status==\"Active\")] | group_by(.version)[] | select(length > $THRESHOLD) | .[0].version" /tmp/nodes)

    # this will be empty if the network does not have >2/3 on a single version
    if [ -z "$NET_VERSION" ]; then
      echo "network has not reached 2/3 consensus on version, skipping upgrade"
      exit 0
    fi

    # retrieve arkeo version
    ARKEO_IMAGE=$(kubectl get deploy arkeo -o jsonpath="{.spec.template.spec.containers[0].image}")

    # sanity checks
    if [ -z "$ARKEO_IMAGE" ]; then
      echo "unable to retrieve arkeo image versions"
      exit 1
    fi

    # abort if we are already up to date
    ARKEO_VERSION=$(echo $ARKEO_IMAGE | awk -F- '{print $3}')
    if [[ "$ARKEO_VERSION" == "$NET_VERSION" ]]; then
      echo "current arkeo version $ARKEO_VERSION is up to date"
      exit 0
    fi

    # patch the arkeo version
    NEW_IMAGE=$(echo $(echo $ARKEO_IMAGE | awk 'BEGIN {FS=OFS="-"} {$NF=""}1')$NET_VERSION)
    echo "updating arkeo version $ARKEO_VERSION -> $NET_VERSION"
    echo "new image $NEW_IMAGE"
    kubectl set image deployment/arkeo {{ .Chart.Name }}=$NEW_IMAGE

  genesis.sh: |
    #!/bin/bash

      set -o pipefail
      set -ex

      CHAIN_ID="arkeo-testnet-v2"
      STAKE="1000000000uarkeo"
      TOKEN="uarkeo"
      USER="ark"
      TOTAL_SUPPLY=1000000000 # Initial supply corresponding to the stake

      add_module() {
        jq --arg ADDRESS "$1" --arg ASSET "$2" --arg AMOUNT "$3" --arg NAME "$4" '.app_state.auth.accounts += [{
              "@type": "/cosmos.auth.v1beta1.ModuleAccount",
              "base_account": {
                "address": $ADDRESS,
                "pub_key": null,
                "sequence": "0"
              },
              "name": $NAME,
              "permissions": []
        }]' <~/.arkeo/config/genesis.json >/tmp/genesis.json
        mv /tmp/genesis.json ~/.arkeo/config/genesis.json

        jq --arg ADDRESS "$1" --arg ASSET "$2" --arg AMOUNT "$3" '.app_state.bank.balances += [{
              "address": $ADDRESS,
              "coins": [ { "denom": $ASSET, "amount": $AMOUNT } ],
          }]' <~/.arkeo/config/genesis.json >/tmp/genesis.json
        mv /tmp/genesis.json ~/.arkeo/config/genesis.json

        TOTAL_SUPPLY=$((TOTAL_SUPPLY + $3))
        echo "Total supply after adding module: $TOTAL_SUPPLY"
      }

      add_account() {
        jq --arg ADDRESS "$1" --arg ASSET "$2" --arg AMOUNT "$3" '.app_state.auth.accounts += [{
              "@type": "/cosmos.auth.v1beta1.BaseAccount",
              "address": $ADDRESS,
              "pub_key": null,
              "account_number": "0",
              "sequence": "0"
          }]' <~/.arkeo/config/genesis.json >/tmp/genesis.json
        mv /tmp/genesis.json ~/.arkeo/config/genesis.json

        jq --arg ADDRESS "$1" --arg ASSET "$2" --arg AMOUNT "$3" '.app_state.bank.balances += [{
              "address": $ADDRESS,
              "coins": [ { "denom": $ASSET, "amount": $AMOUNT } ],
          }]' <~/.arkeo/config/genesis.json >/tmp/genesis.json
        mv /tmp/genesis.json ~/.arkeo/config/genesis.json

        TOTAL_SUPPLY=$((TOTAL_SUPPLY + $3))
        echo "Total supply after adding account: $TOTAL_SUPPLY"
      }

      add_claim_records() {
        jq --arg CHAIN "$1" --arg ADDRESS "$2" --arg AMOUNTCLAIM "$3" --arg AMOUNTVOTE "$4" --arg AMOUNTDELEGATE "$5" --arg ISTRANSFERABLE "$6" '.app_state.claimarkeo.claim_records += [{
              "chain": $CHAIN,
          "address": $ADDRESS,
              "amount_claim": { "denom": "uarkeo", "amount": $AMOUNTCLAIM },
              "amount_vote": { "denom": "uarkeo", "amount": $AMOUNTVOTE },
              "amount_delegate": { "denom": "uarkeo", "amount": $AMOUNTDELEGATE },
              "is_transferable": true,
          }]' <~/.arkeo/config/genesis.json >/tmp/genesis.json
        mv /tmp/genesis.json ~/.arkeo/config/genesis.json
      }

      set_fee_pool() {
        local denom="$1"
        local amount="$2"

        jq --arg DENOM "$denom" --arg AMOUNT "$amount" '.app_state.distribution.fee_pool.community_pool = [{
              "denom": $DENOM,
              "amount": $AMOUNT
          }]' <~/.arkeo/config/genesis.json >/tmp/genesis.json
        mv /tmp/genesis.json ~/.arkeo/config/genesis.json
      }

      disable_mint_params() {
        jq '.app_state.mint.minter.inflation = "0.000000000000000000" |
              .app_state.mint.minter.annual_provisions = "0.000000000000000000" |
              .app_state.mint.params.inflation_rate_change = "0.000000000000000000" |
              .app_state.mint.params.inflation_max = "0.000000000000000000" |
              .app_state.mint.params.inflation_min = "0.000000000000000000"' \
          <~/.arkeo/config/genesis.json >/tmp/genesis.json
        mv /tmp/genesis.json ~/.arkeo/config/genesis.json
      }

      if [ ! -f ~/.arkeo/config/priv_validator_key.json ]; then
        # remove the original generate genesis file, as below will init chain again
        rm -rf ~/.arkeo/config/genesis.json
      fi

      if [ ! -f ~/.arkeo/config/genesis.json ]; then
        arkeod init local --default-denom $TOKEN --chain-id "$CHAIN_ID"
        arkeod keys add $USER --keyring-backend test
        arkeod genesis add-genesis-account $USER $STAKE --keyring-backend test
        arkeod keys list --keyring-backend test
        arkeod genesis gentx $USER $STAKE --chain-id $CHAIN_ID --keyring-backend test
        arkeod genesis collect-gentxs

        arkeod keys add faucet --keyring-backend test
        FAUCET=$(arkeod keys show faucet -a --keyring-backend test)
        add_account "$FAUCET" $TOKEN 2900000000000000 # faucet, 29m
        disable_mint_params

        if [ "$NET" = "mocknet" ] || [ "$NET" = "testnet" ]; then
          add_module tarkeo1d0m97ywk2y4vq58ud6q5e0r3q9khj9e3unfe4t $TOKEN 2420000000000000 'arkeo-reserve'
          add_module tarkeo14tmx70mvve3u7hfmd45vle49kvylk6s2wllxny $TOKEN 3025000000000000 'claimarkeo'
          add_module tarkeo1jv65s3grqf6v6jl3dp4t6c9t9rk99cd8t6gr9e $TOKEN 4840000000000000 'distribution'
          # this is to handle the balance set to distribution as a community pool
          set_fee_pool $TOKEN 4840000000000000

          # Add Foundational Accounts
          #   FoundationDevAccount       = "tarkeo1x978nttd8vgcgnv9wxut4dh7809lr0n2fhuh0q"
          add_account "tarkeo1x978nttd8vgcgnv9wxut4dh7809lr0n2fhuh0q" $TOKEN 1210000000000000
          #   FoundationGrantsAccount    = "tarkeo1a307z4a82mcyv9njdj9ajnd9xpp90kmeqwntxj"
          add_account "tarkeo1a307z4a82mcyv9njdj9ajnd9xpp90kmeqwntxj" $TOKEN 605000000000000

          # Thorchain derived test addresses
          add_account "tarkeo1dllfyp57l4xj5umqfcqy6c2l3xfk0qk6zpc3t7" $TOKEN 1000000000000000 # bob, 10m
          add_claim_records "ARKEO" "tarkeo1dllfyp57l4xj5umqfcqy6c2l3xfk0qk6zpc3t7" 1000 1000 1000 true
          add_account "tarkeo1xrz7z3zwtpc45xm72tpnevuf3wn53re8q4u4nr" $TOKEN 1000000000000000
          add_claim_records "ARKEO" "tarkeo1xrz7z3zwtpc45xm72tpnevuf3wn53re8q4u4nr" 1000 1000 1000 true

          # add_claim_records "ARKEO" "{YOUR ARKEO ADDRESS}" 500000 500000 500000 true
          # add_account "{YOUR ARKEO ADDRESS}" $TOKEN 1000000000000000

          # add_claim_records "ETHEREUM" "{YOUR ETH ADDRESS}" 500000 600000 700000 true
          add_claim_records "ETHEREUM" "0x92E14917A0508Eb56C90C90619f5F9Adbf49f47d" 500000 600000 700000 true

          # enable CORs on testnet/localnet
          sed -i 's/enabled-unsafe-cors = false/enabled-unsafe-cors = true/g' ~/.arkeo/config/app.toml
          sed -i 's/cors_allowed_origins = \[\]/cors_allowed_origins = \["*"\]/g' ~/.arkeo/config/config.toml
        else
          source ./add-claim-records.sh
        fi

        sed -i 's/"stake"/"uarkeo"/g' ~/.arkeo/config/genesis.json
        sed -i '/"duration_until_decay"\|"duration_of_decay"/s/"3600s"/"7884000s"/' ~/.arkeo/config/genesis.json
        sed -i 's/enable = false/enable = true/g' ~/.arkeo/config/app.toml
        sed -i 's/127.0.0.1:26657/0.0.0.0:26657/g' ~/.arkeo/config/config.toml
        sed -i 's/address = "tcp:\/\/localhost:1317"/address = "tcp:\/\/0.0.0.0:1317"/g' ~/.arkeo/config/app.toml

        # Update the supply field in genesis.json using jq
        jq --arg DENOM "$TOKEN" --arg AMOUNT "$TOTAL_SUPPLY" '.app_state.bank.supply = [{"denom": $DENOM, "amount": $AMOUNT}]' <~/.arkeo/config/genesis.json >/tmp/genesis.json
        mv /tmp/genesis.json ~/.arkeo/config/genesis.json

        set -e
        arkeod validate-genesis --trace
      fi

      arkeod start --pruning nothing --minimum-gas-prices 0.0001uarkeo
  setup-testnet.sh: |
    #!/bin/sh
    set -e

    # Download Arkeo binary
    curl -L -o /usr/local/bin/arkeod https://github.com/arkeonetwork/arkeo/releases/download/{{ .Values.arkeo.version }}/arkeod_linux_amd64_testnet
    chmod +x /usr/local/bin/arkeod

    # Initialize the node
    arkeod init {{ .Values.arkeo.moniker }} --chain-id {{ .Values.chainID.mainnet }}

    # Download genesis file
    curl -s {{ .Values.env.RPC }}/genesis | jq '.result.genesis' > $HOME/.arkeo/config/genesis.json

    # Configure app settings
    sed -i -e "s/^pruning *=.*/pruning = \"{{ .Values.arkeo.app_setting.pruning }}\"/" $HOME/.arkeo/config/app.toml
    sed -i -e "s/^pruning-keep-recent *=.*/pruning-keep-recent = \"{{ .Values.arkeo.app_setting.pruning_keep_recent }}\"/" $HOME/.arkeo/config/app.toml
    sed -i -e "s/^pruning-interval *=.*/pruning-interval = \"{{ .Values.arkeo.app_setting.pruning_interval }}\"/" $HOME/.arkeo/config/app.toml
    sed -i 's|minimum-gas-prices =.*|minimum-gas-prices = "{{ .Values.arkeo.app_setting.minimum_gas_prices }}"|g' $HOME/.arkeo/config/app.toml
    sed -i 's|swagger =.*| swagger = {{ .Values.arkeo.app_setting.swagger }}|g' $HOME/.arkeo/config/app.toml

    # Configure seeds and peers
    SEEDS="{{ .Values.arkeo.seeds }}"
    PEERS="{{ .Values.arkeo.peers }}"
    sed -i -e "/^\[p2p\]/,/^\[/{s/^[[:space:]]*seeds *=.*/seeds = \"$SEEDS\"/}" \
           -e "/^\[p2p\]/,/^\[/{s/^[[:space:]]*persistent_peers *=.*/persistent_peers = \"$PEERS\"/}" $HOME/.arkeo/config/config.toml
    
    apk update && apk add lz4

    curl -s {{ .Values.arkeo.addrbook }} > $HOME/.arkeo/config/addrbook.json
    
    cp $HOME/.arkeo/data/priv_validator_state.json $HOME/.arkeo/priv_validator_state.json.backup

    arkeod tendermint unsafe-reset-all --home $HOME/.arkeo --keep-addr-book
    curl {{ .Values.arkeo.snapshot }} | lz4 -dc - | tar -xf - -C $HOME/.arkeo

    mv $HOME/.arkeo/priv_validator_state.json.backup $HOME/.arkeo/data/priv_validator_state.json


  validator.sh: |
    #!/bin/bash

    set -o pipefail
    set -ex

    curl -L -o /usr/local/bin/arkeod https://github.com/arkeonetwork/arkeo/releases/download/{{ .Values.arkeo.version }}/arkeod_linux_amd64_testnet
    chmod +x /usr/local/bin/arkeod

    CHAIN_ID=${CHAIN_ID:-"arkeo"}
    MONIKER=${MONIKER:-"default-validator"}
    WALLET_NAME=${WALLET_NAME:-"wallet"}
    FEES=${FEES:-"5000uarkeo"}
    AMOUNT=${AMOUNT:-"1000000"}
    AMOUNT=$(printf "%.0f" "$AMOUNT")
    VALIDATOR_JSON="/root/.arkeo/validator.json"
    PUBKEY=$(arkeod tendermint show-validator | jq -c)

    cat <<EOF > "$VALIDATOR_JSON"
    {
      "pubkey": $PUBKEY,
      "amount": "${AMOUNT}uarkeo",
      "moniker": "$MONIKER",
      "identity": "",
      "website": "",
      "security": "",
      "details": "Arkeo validator node",
      "commission-rate": "0.05",
      "commission-max-rate": "0.2",
      "commission-max-change-rate": "0.1",
      "min-self-delegation": "1"
    }
    EOF

    if ! arkeod keys show "$WALLET_NAME" --keyring-backend test > /dev/null 2>&1; then
      echo "Wallet '$WALLET_NAME' not found. Recovering with provided mnemonic."
      
      if [ -z "$MNEMONIC" ]; then
        echo "Error: MNEMONIC is not set. Cannot recover the wallet."
        exit 1
      fi

      echo "$MNEMONIC" | arkeod keys add "$WALLET_NAME" --keyring-backend test --recover
    else
      echo "Wallet '$WALLET_NAME' already exists. Skipping recovery."
    fi

    arkeod query bank balances $(arkeod keys show $WALLET_NAME -a  --keyring-backend test) --node http://{{ .Values.env.RPC }}

    VALIDATOR_ADDRESS=$(arkeod keys show "$WALLET_NAME" --bech val -a --keyring-backend test)
    IS_VALIDATOR=$(arkeod query staking validator "$VALIDATOR_ADDRESS" --node http://{{ .Values.env.RPC }} -o json | jq -r '.validator.status')

    if [[ "$IS_VALIDATOR" == "BOND_STATUS_BONDED" ]]; then
      echo "Node is already an active validator with status: $IS_VALIDATOR. Skipping creation."

    elif [[ "$IS_VALIDATOR" == "BOND_STATUS_UNBONDING" || "$IS_VALIDATOR" == "BOND_STATUS_UNBONDED" ]]; then
      echo "Node is in $IS_VALIDATOR state. Rebonding validator..."

      arkeod tx staking edit-validator "$VALIDATOR_JSON" \
        --from "$WALLET_NAME" \
        --chain-id "$CHAIN_ID" \
        --fees="$FEES" \
        --keyring-backend test \
        --yes


      sleep 10s

      arkeod tx slashing unjail --from "$WALLET_NAME" --chain-id "$CHAIN_ID" --gas auto --gas-adjustment 1.5 --gas-prices 0.025uarkeo  --keyring-backend test

    else
      echo "Node is not a validator. Creating validator..."

      arkeod tx staking create-validator "$VALIDATOR_JSON" \
        --chain-id "$CHAIN_ID" \
        --from "$WALLET_NAME" \
        --fees="$FEES" \
        --keyring-backend test \
        --yes
    fi
        